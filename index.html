<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shad4AllTech.Services</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --text-main: #f9fafb;
            --text-sub: #9ca3af;
            --primary: #3b82f6;
            --accent: #f59e0b;
            --border-color: #1f2937;
            --whatsapp-color: #25D366;
        }

        body {
            margin: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.7;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            background-color: rgba(17, 24, 39, 0.8);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .lang-select {
            padding: 0.4rem 0.8rem;
            background-color: #1f2937;
            color: white;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            cursor: pointer;
        }

        .container {
            max-width: 800px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .payment-box {
            background: #1e293b;
            border-right: 4px solid var(--accent);
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-sub);
        }

        input, select, textarea {
            width: 100%;
            padding: 0.75rem;
            background-color: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-main);
            margin-bottom: 1rem;
            box-sizing: border-box;
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
        }

        .btn-whatsapp {
            background-color: var(--whatsapp-color);
            margin-top: 0.5rem;
            text-decoration: none;
            display: block;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>Shad4AllTech.Services</h2>
        <select class="lang-select" id="langSwitcher" onchange="changeLanguage()">
            <option value="ckb">کوردی</option>
            <option value="ar">العربية</option>
            <option value="en">English</option>
        </select>
    </div>

    <div class="container">
        <div class="card">
            <h3 id="payTitle">💳 زانیاریی پارەدانی خزمەتگوزاری</h3>
            <div class="payment-box">
                <p><b id="payNumLabel">ژمارەی فاست پەی / FIB:</b> <span style="color: var(--accent); font-weight: bold;">07504909260</span></p>
                <p><b id="payPriceLabel">بڕی پارەی پێویست:</b> <span id="priceDisplay" style="color: #10b981; font-weight: bold;">$15</span></p>
            </div>
            <p id="payNote" style="font-size: 0.9rem; color: var(--text-sub);">تێبینی: دوای ئەنجامدانی پارەدان، پسوولەکەت بنێرە بۆ وەتسئەپ بۆ کارا کردنی خێرا.</p>
            <a href="https://wa.me/9647504909260?text=سڵاو،%20وێنەی%20پسوولەی%20پارەدانم%20ناردووە" id="btnWhatsapp" class="btn btn-whatsapp" target="_blank">📲 ناردنی پسوولە بۆ وەتسئەپ</a>
        </div>

        <div class="card">
            <h3 id="formTitle">🛠️ دروستکردنی پڕۆژەی نوێ</h3>
            
            <label id="lblType" for="projectType">جۆری پڕۆژە هەڵبژێرە:</label>
            <select id="projectType" onchange="updatePrice()">
                <option value="15">ماڵپەڕی ئاسایی - $15</option>
                <option value="30">ئەپڵیکەیشنی مۆبایل - $30</option>
                <option value="50">سیستەم و بنکەی داتا - $50</option>
            </select>

            <label id="lblApiKey" for="apiKey">کلیلی تایبەت (OpenAI / Anthropic API Key):</label>
            <input type="password" id="apiKey" placeholder="sk-proj-..." required>

            <label id="lblName" for="projectName">ناوی پڕۆژە:</label>
            <input type="text" id="projectName" placeholder="..." required>

            <label id="lblNotes" for="projectNotes">ڕوونکردنەوە یان داواکارییەکان:</label>
            <textarea id="projectNotes" rows="4" placeholder="..."></textarea>

            <button id="btnSubmit" class="btn" onclick="submitProject()">🚀 ناردن و دروستکردنی پڕۆژە</button>
        </div>
    </div>
